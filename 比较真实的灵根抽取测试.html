        "你是【四灵根】，正魔之别，存乎一心。",

        "你是【五灵根】，莫要强求，顺其自然。",

        "你拥有【五灵根】，或许你本就是凡人，何必修仙。",
        "五灵根之体，可以尝试修炼魔功，以煞气炼体。",
        "你是【五灵根】，正魔两道皆难，不如逍遥凡尘。"
    ];

    // ---------- 基础数据 ----------
    const baseRoots = ['金', '木', '水', '火', '土'];
    // 金=1.2, 木=0.7, 水=0.7, 火=1.2, 土=1.2
    // 木和水各下调约30%
    const weights = [1.2, 0.7, 0.7, 1.2, 1.2];
    const mutationMap = {
        '金': { target: '音', rate: 0.025 },
        '木': { target: '花', rate: 0.025 },
        '水': { target: '幻', rate: 0.025 },
        '火': { target: '电', rate: 0.05 },
        '土': { target: '幽冥', rate: 0.05 }
    };

    // ---------- localStorage ----------
    function loadData() {
        let raw = localStorage.getItem('lingenTestData');
        if (raw) {
            try { return JSON.parse(raw); } catch(e) {}
        }
        return { history: [], recoveryTime: null };
    }
    function saveData(data) {
        localStorage.setItem('lingenTestData', JSON.stringify(data));
    }

    // ---------- 恢复次数 ----------
    function checkAndRecover(data) {
        const now = Date.now();
        let validCount = data.history.filter(item => item.valid).length;
        if (validCount >= MAX_VALID && data.recoveryTime) {
            const elapsed = now - data.recoveryTime;
            const intervals = Math.floor(elapsed / RECOVERY_INTERVAL_MS);
            if (intervals > 0) {
                const invalidItems = data.history.filter(item => !item.valid);
                const sortedInvalid = invalidItems.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                const toChange = Math.min(intervals, invalidItems.length, MAX_VALID - validCount);
                for (let i = 0; i < toChange; i++) {
                    sortedInvalid[i].valid = true;
                }
                if (toChange > 0) {
                    data.recoveryTime = now;
                }
            }
        } else if (validCount < MAX_VALID) {
            data.recoveryTime = null;
        }
        return data;
    }

// ========== 核心函数：根据描述生成正确数量的灵根 ==========
    function generateRootString(desc) {
        // 1. 确定需要的数量
        let count = 1;
        if (desc.includes('极品天灵根')) count = 1;
        else if (desc.includes('单灵根')) count = 1;
        else if (desc.includes('双灵根')) count = 2;
        else if (desc.includes('三灵根')) count = 3;
        else if (desc.includes('四灵根')) count = 4;
        else if (desc.includes('五灵根')) count = 5;

        // 2. 构建加权扩展池
        let pool = [];
        baseRoots.forEach((root, idx) => {
            let w = Math.round(weights[idx] * 10); 
            for (let i = 0; i < w; i++) {
                pool.push(root);
            }
        });

        // 3. Fisher-Yates 洗牌
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        // 4. 从洗好的池中取前 count 个，并去重
        let selected = [];
        let seen = new Set();
        for (let root of pool) {
            if (!seen.has(root)) {
                seen.add(root);
                selected.push(root);
                if (selected.length === count) break;
            }
        }

        // 5. 如果去重后数量不足，从 baseRoots 补
        if (selected.length < count) {
            for (let root of baseRoots) {
                if (!seen.has(root)) {
                    seen.add(root);
                    selected.push(root);
                    if (selected.length === count) break;
                }
            }
        }

        // 6. 对每个灵根进行变异判断
        let final = selected.map(r => {
            const mut = mutationMap[r];
            if (mut && Math.random() < mut.rate) {
                return mut.target;
            }
            return r;
        });

        return final.join('、');
    }

    // ---------- 有效性判断 ----------
    function isValidRoot(desc) {
        return desc.includes('双灵根') || desc.includes('单灵根') || desc.includes('极品天灵根');
    }
    
    function getRank(desc) {
        if (desc.includes('极品天灵根')) return 1;
        if (desc.includes('单灵根')) return 2;
        if (desc.includes('双灵根')) return 3;
        if (desc.includes('三灵根')) return 4;
        if (desc.includes('四灵根')) return 5;
        if (desc.includes('五灵根')) return 6;
        return 99;
    }

    // ---------- 渲染颜色 ----------
    function renderColoredRoots(rootStr) {
        if (!rootStr) return '';
        return rootStr.split('、').map(r => {
            const color = getRootColor(r);
            return `<span class="root-item" style="color:${color};">${r}</span>`;
        }).join('、');
    }

   // ---------- 自动修复旧数据 ----------
    function repairHistory(data) {
        let repaired = false;
        data.history.forEach(item => {
            // 获取描述中应有的数量
            let expected = 1;
            if (item.desc.includes('极品天灵根')) expected = 1;
            else if (item.desc.includes('单灵根')) expected = 1;
            else if (item.desc.includes('双灵根')) expected = 2;
            else if (item.desc.includes('三灵根')) expected = 3;
            else if (item.desc.includes('四灵根')) expected = 4;
            else if (item.desc.includes('五灵根')) expected = 5;

            // 检查实际存储的灵根数量
            let actual = item.root ? item.root.split('、').length : 0;
            if (actual !== expected) {
                // 重新生成正确的灵根字符串
                item.root = generateRootString(item.desc);
                repaired = true;
            }
        });
        return repaired;
    }

    // ---------- UI更新 ----------
    function updateUI(data) {
        data = checkAndRecover(data);
        // 修复历史记录
        if (repairHistory(data)) {
            saveData(data);
        }

        const validCount = data.history.filter(item => item.valid).length;
        const totalCount = data.history.length;
        document.getElementById('valid-count').textContent = validCount;
        document.getElementById('total-count').textContent = totalCount;

        const recoveryDiv = document.getElementById('recovery-info');
        if (validCount >= MAX_VALID) {
            document.getElementById('status-text').textContent = '已测满（恢复中）';
            document.getElementById('testBtn').disabled = true;
            document.getElementById('testBtn').textContent = '已测满';
            if (!data.recoveryTime) {
                data.recoveryTime = Date.now();
                saveData(data);
            }
            const elapsed = Date.now() - data.recoveryTime;
            const remaining = Math.max(0, RECOVERY_INTERVAL_MS - elapsed);
            const hours = Math.floor(remaining / (60 * 60 * 1000));
            const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
            recoveryDiv.innerHTML = `⏳ 下次恢复有效次数：<span class="highlight-time">${hours}小时${minutes}分钟</span> 后`;
        } else {
            document.getElementById('status-text').textContent = '可测试';
            document.getElementById('testBtn').disabled = false;
            document.getElementById('testBtn').textContent = '逆天改命';
            recoveryDiv.innerHTML = validCount > 0 ? `✅ 当前有效次数 ${validCount}/3` : '';
            if (data.recoveryTime) {
                data.recoveryTime = null;
                saveData(data);
            }
        }

        // 排序历史
        const sorted = [...data.history].sort((a, b) => getRank(a.desc) - getRank(b.desc));
        const listDiv = document.getElementById('history-list');
        if (sorted.length === 0) {
            listDiv.innerHTML = '<div style="color:#5a6a7a; font-size:0.8rem; text-align:center;">暂无记录</div>';
        } else {
            let html = '';
            sorted.forEach((item, index) => {
                const validLabel = item.valid ? '<span class="valid">[有效]</span>' : '<span class="invalid">[无效]</span>';
                const coloredRoots = renderColoredRoots(item.root);
                let delAttr = item.id ? `onclick="deleteEntry('${item.id}')"` :
                    `onclick="deleteEntryByKey('${encodeURIComponent(item.desc + '||' + item.root)}')"`;
                html += `<div class="history-item">
                    <span class="seq">#${index+1}</span> ${validLabel}
                    <span class="desc-text">${item.desc}</span>
                    <span class="arrow">→</span>
                    <span class="root-display">${coloredRoots}</span>
                    <button class="del-btn" ${delAttr}>✕</button>
                </div>`;
            });
            listDiv.innerHTML = html;
        }

        // 定时刷新倒计时
        if (validCount >= MAX_VALID && data.recoveryTime) {
            if (window._recoveryTimer) clearInterval(window._recoveryTimer);
            window._recoveryTimer = setInterval(() => {
                const currentData = loadData();
                updateUI(currentData);
            }, 30000);
        } else {
            if (window._recoveryTimer) {
                clearInterval(window._recoveryTimer);
                window._recoveryTimer = null;
            }
        }
    }

    // ---------- 删除功能 ----------
    function deleteEntry(id) {
        if (!confirm('确定删除该记录吗？')) return;
        let data = loadData();
        data.history = data.history.filter(item => item.id !== id);
        saveData(data);
        updateUI(data);
        document.getElementById('result-box').innerHTML = '记录已删除。';
    }
    function deleteEntryByKey(key) {
        if (!confirm('确定删除该记录吗？')) return;
        let data = loadData();
        const [desc, root] = decodeURIComponent(key).split('||');
        const idx = data.history.findIndex(item => item.desc === desc && item.root === root);
        if (idx !== -1) {
            data.history.splice(idx, 1);
            saveData(data);
            updateUI(data);
            document.getElementById('result-box').innerHTML = '记录已删除。';
        } else {
            alert('未找到该记录。');
        }
    }

    // ---------- 主测试 ----------
    function testRoot() {
        let data = loadData();
        data = checkAndRecover(data);
        saveData(data);

        const validCount = data.history.filter(item => item.valid).length;
        if (validCount >= MAX_VALID) {
            document.getElementById('result-box').innerHTML = `
                <div style="color: #ffaa66;">⚠️ 已测满 ${MAX_VALID} 次，请等待恢复。</div>
                <div class="root-detail">天道有常，知足常乐。</div>
            `;
            updateUI(data);
            return;
        }

        const idx = Math.floor(Math.random() * descriptions.length);
        let desc = descriptions[idx];
        const rootStr = generateRootString(desc);
        const valid = isValidRoot(desc);

        const id = Date.now() + '_' + Math.random().toString(36).substr(2, 6);

        data.history.push({
            id: id,
            desc: desc,
            root: rootStr,
            valid: valid,
            timestamp: Date.now()
        });
        saveData(data);

        const box = document.getElementById('result-box');
        const validText = valid ? '✅ 消耗有效次数' : '❌ 不消耗次数';
        box.innerHTML = `
            <div>${desc}</div>
            <div class="root-detail">
                ✦ 灵根属性：<span class="highlight">${rootStr}</span>
                <span style="display:block; margin-top:6px; font-size:0.85rem; color:#8a9aaa;">${validText}</span>
            </div>
        `;

        if (valid) {
            data.recoveryTime = null;
            saveData(data);
        }

        updateUI(data);
    }

    // ---------- 初始化 ----------
    window.onload = function() {
        const data = loadData();
        // 修复任何已存在的错误数据
        repairHistory(data);
        data = checkAndRecover(data);
        saveData(data);
        updateUI(data);
        if (data.history.length > 0) {
            const last = data.history[data.history.length - 1];
            const validText = last.valid ? '✅ 消耗有效次数' : '❌ 不消耗次数';
            document.getElementById('result-box').innerHTML = `
                <div>${last.desc}</div>
                <div class="root-detail">
                    ✦ 灵根属性：<span class="highlight">${last.root}</span>
                    <span style="display:block; margin-top:6px; font-size:0.85rem; color:#8a9aaa;">${validText}</span>
                </div>
            `;
        } else {
            document.getElementById('result-box').innerHTML = '点击「逆天改命」，窥探你的灵根天命。';
        }
    };
</script>
